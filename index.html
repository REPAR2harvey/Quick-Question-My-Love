<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quick question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #fff;
    color: #222;
    font-family: "Patrick Hand", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive;
    font-size: 22px;
    line-height: 1.3;
    overflow: hidden;
    touch-action: manipulation;
  }
  .screen {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 24px;
    text-align: center;
    overflow-y: auto;
  }
  .screen.on { display: flex; }

  p { margin: 0; }
  .q { font-size: clamp(34px, 9vw, 52px); line-height: 1.15; }
  .q span { display: block; font-size: .68em; color: #666; margin-top: 6px; }

  .row { display: flex; gap: 18px; justify-content: center; align-items: center; min-height: 84px; }
  button {
    font: inherit;
    font-size: 26px;
    min-width: 108px;
    min-height: 52px;
    padding: 6px 26px 8px;
    border: 2.5px solid #222;
    /* uneven corners so the outline looks drawn by hand */
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
    background: #fff;
    color: #222;
    cursor: pointer;
    transition: transform .2s ease;
  }
  #no { border-radius: 18px 225px 18px 255px / 255px 18px 225px 18px; }
  button:active { background: #222; color: #fff; }
  button:focus-visible { outline: 2px dashed #222; outline-offset: 4px; }

  #msg {
    min-height: 1.3em;
    font-size: 28px;
    color: #d6282f;
    transform: rotate(-2deg);
  }
  #msg.wob { animation: wob .3s ease; }
  @keyframes wob {
    0% { transform: rotate(-2deg) scale(.7); }
    60% { transform: rotate(3deg) scale(1.1); }
    100% { transform: rotate(-2deg) scale(1); }
  }

  #gun {
    display: none;
    width: auto;
    max-width: min(60vw, 280px);
    max-height: 34vh;
  }
  #gun.on { display: block; animation: gun .25s ease-out; }
  @keyframes gun { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

  #s3 .q { color: #d6282f; }
  #photo {
    width: auto;
    max-width: min(78vw, 370px);
    max-height: 54vh;
    transform: rotate(-2.5deg);
    box-shadow: 0 3px 14px rgba(0, 0, 0, .22);
  }

  #hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .heart {
    position: absolute;
    bottom: -40px;
    animation: rise linear forwards;
  }
  .heart svg { display: block; width: 100%; height: 100%; fill: #e3242b; transform: rotate(var(--tilt)); }
  @keyframes rise {
    from { transform: translate(0, 0); opacity: 1; }
    to   { transform: translate(var(--drift), -112vh); opacity: .25; }
  }

  @media (prefers-reduced-motion: reduce) {
    #msg.wob, #gun.on { animation: none; }
    button { transition: none; }
  }
</style>
</head>
<body>

<section class="screen on" id="s1">
  <p class="q">Hey My Love!<span>Quick question</span></p>
  <button id="next">Next</button>
</section>

<div id="hearts" aria-hidden="true"></div>

<script>
  const $ = id => document.getElementById(id);
  const show = id => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    $(id).classList.add('on');
  };

  $('next').addEventListener('click', () => show('s2'));

  const lines = ['Try again!', 'Wrong answer', 'One last chance'];
  let noCount = 0;

  $('no').addEventListener('click', () => {
    if (noCount >= lines.length) { win(); return; }   // it says "Yes" by now
    const m = $('msg');
    m.textContent = lines[noCount];
    m.classList.remove('wob'); void m.offsetWidth; m.classList.add('wob');
    noCount++;
    $('yes').style.transform = 'scale(' + (1 + noCount * 0.12) + ')';
    $('no').style.transform = 'scale(' + (1 - noCount * 0.1) + ')';
    if (noCount === lines.length) {
      $('gun').classList.add('on');
      $('no').textContent = 'Yes';
      $('yes').style.transform = $('no').style.transform = '';
    }
  });

  $('yes').addEventListener('click', win);

  let won = false;
  function win() {
    if (won) return;
    won = true;
    show('s3');
    for (let i = 0; i < 24; i++) setTimeout(spawnHeart, i * 110);
    setInterval(spawnHeart, 380);
  }

  const HEART = '<svg viewBox="0 0 24 22"><path d="M12 21.5C5.4 16 1 12.2 1 7.3 1 3.8 3.7 1 7.1 1c1.9 0 3.7.9 4.9 2.4C13.2 1.9 15 1 16.9 1 20.3 1 23 3.8 23 7.3c0 4.9-4.4 8.7-11 14.2z"/></svg>';

  function spawnHeart() {
    const h = document.createElement('span');
    h.className = 'heart';
    h.innerHTML = HEART;
    const size = 14 + Math.random() * 22;
    h.style.width = size + 'px';
    h.style.height = size + 'px';
    h.style.left = (Math.random() * 94) + 'vw';
    h.style.setProperty('--tilt', (Math.random() * 40 - 20) + 'deg');
    h.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    h.style.animationDuration = (4 + Math.random() * 3) + 's';
    $('hearts').appendChild(h);
    h.addEventListener('animationend', () => h.remove());
  }
</script>
